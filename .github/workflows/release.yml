name: 'Release & Publish'

# This workflow runs when a new GitHub release is created
on:
  release:
    types: [created]

# GITHUB_TOKEN needs write access to upload release assets
permissions:
  contents: write

jobs:
  build-linux:
    # We'll run on Ubuntu as it's required for .deb and .snap packages
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 'Install Snapcraft'
        run: |
          sudo snap install snapcraft --classic

      - name: 'Install Dependencies'
        run: npm ci

      - name: 'Build Application Packages'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set Snap Version'
        run: node scripts/set-snap-version.cjs

      - name: 'Pack Snap'
        id: snap-build
        run: |
          mkdir -p out/make/snap/x64/
          # --destructive-mode allows building without a VM/Container
          sudo snapcraft pack --output out/make/snap/x64/ --destructive-mode
          # Set the snap path as an output for the next steps
          SNAP_PATH=$(find ./out/make/snap -name '*.snap' -type f | head -n 1)
          echo "SNAP_PATH=$SNAP_PATH" >> $GITHUB_ENV

      - name: 'Upload .deb to Release'
        run: |
          # Find the .deb file generated by Electron Forge. The path may vary slightly.
          DEB_PATH=$(find ./out/make/deb -name "*.deb" -type f | head -n 1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::.deb file not found!"
            exit 1
          fi
          echo "Uploading $DEB_PATH to release..."
          gh release upload ${{ github.event.release.tag_name }} "$DEB_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Upload .snap to Release'
        run: |
          # Find the .snap file generated by Electron Forge. The path may vary slightly.
          SNAP_PATH=$(find ./out/make/snap -name "*.snap" -type f | head -n 1)
          if [ -z "$SNAP_PATH" ]; then
            echo "::error::.snap file not found!"
            exit 1
          fi
          echo "Uploading $SNAP_PATH to release..."
          gh release upload ${{ github.event.release.tag_name }} "$SNAP_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Publish to Snap Store'
        # Non-fatal: the .snap is already uploaded as a release asset above.
        # This step only fails if the SNAPCRAFT_LOGIN secret is missing
        # (common on fork repos) - configure it in Settings -> Secrets.
        continue-on-error: true
        uses: snapcore/action-publish@v1
        env:
          # Set the snapcraft credentials env variable
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}
        with:
          snap: ${{ env.SNAP_PATH }}
          release: edge

  build-linux-arm64:
    # Native ARM runner as host; actual build runs in a Debian 11 (bullseye)
    # container so the .deb keeps an older glibc baseline (2.31).
    runs-on: ubuntu-24.04-arm
    container: node:22-bullseye
    steps:
      - name: 'Install Build Tools'
        run: |
          apt-get update
          apt-get install -y dpkg-dev fakeroot curl gpg
          # GitHub CLI apt repo (needed to upload the release asset)
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y gh
          # Electron runtime deps: electron-vite's bytecodePlugin() spawns the
          # electron binary to compile preload to .jsc; the minimal bullseye
          # image lacks the GUI/X11 libs electron needs to even start, causing
          # an EPIPE when the process exits immediately.
          apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0 \
            libpango-1.0-0 libcairo2 libgtk-3-0 libglib2.0-0

      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Install Dependencies'
        run: npm ci

      - name: 'Build arm64 .deb'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Upload arm64 .deb to Release'
        run: |
          DEB_PATH=$(find ./out/make/deb -name "*.deb" -type f | head -n 1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::arm64 .deb file not found!"
            exit 1
          fi
          echo "Uploading $DEB_PATH to release..."
          # --repo avoids a 'dubious ownership' git error: the checkout action
          # sets safe.directory under a temporary HOME that is no longer active
          # when this step runs inside the bullseye container.
          gh release upload ${{ github.event.release.tag_name }} "$DEB_PATH" --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    # Pin to windows-2022: @electron/node-gyp bundled with Electron 35
    # cannot detect VS 2026 on the newer windows-latest (win25-vs2026) image
    runs-on: windows-2022
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 'Install Dependencies'
        run: npm ci
        shell: powershell

      - name: 'Build Windows Package'
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell

      - name: 'Upload .exe to Release'
        run: |
          # Use a broader search to find EITHER .exe or .msi
          $PACKAGE_PATH = (Get-ChildItem -Path ./out/make/**/*.exe, ./out/make/**/*.msi -Recurse | Select-Object -First 1).FullName
          
          if (-not $PACKAGE_PATH) {
            Write-Error "No installer file (.exe or .msi) found in ./out/make/"
            exit 1
          }
          
          Write-Host "Found package at: $PACKAGE_PATH"
          # Quote the path to handle spaces
          gh release upload ${{ github.event.release.tag_name }} "$PACKAGE_PATH" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell